{% set name = "DataLab" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/d/datalab_platform/datalab_platform-{{ version }}.tar.gz
  sha256: e8faac5b325b1c12e08c309caee2a3febaf9fe7bc63d22fd0e22a80ef716adf6

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - datalab = datalab.app:run
    - datalab-demo = datalab.tests.scenarios.demo:run
    - datalab-tests = datalab.tests:run
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - guidata >=3.15.1
    - plotpy >=2.11.0
    - sigima >=1.2.0
    - sigimax >=1.0.2
    - numpy >=1.22,<2.5
    - scipy >=1.10.1,<1.17
    - scikit-image >=0.19.2,<0.27
    - pandas >=1.4,<3.1
    - pywavelets >=1.2,<2.0
    - psutil >=5.8
    - fastapi
    - uvicorn
    - pydantic

test:
  imports:
    - datalab
  commands:
    - pip check
    - QT_QPA_PLATFORM=offscreen pytest --collect-only --pyargs datalab.tests
  requires:
    - pip
    - python {{ python_min }}
    - pytest
    - httpx
    - pyqt

about:
  summary: DataLab is a data processing and analysis software for scientific and industrial applications
  home: https://datalab-platform.com/
  description: |
    DataLab is an open-source platform for signal and image processing and visualization for research, education and industry. 
    Leveraging the richness of the scientific Python ecosystem, DataLab is the ideal complement to your data analysis workflows 
    as it can be extended with your Python code through plugins or directly from your IDE or your Jupyter notebooks.
  doc_url: https://datalab-platform.com/
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - PierreRaybaut
